# This rule is not used by the project jenkins-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ci.tomciusromcius.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: jenkins-operator
    app.kubernetes.io/managed-by: kustomize
  name: jenkins-editor-role
rules:
- apiGroups:
  - ci.tomciusromcius.github.io
  resources:
  - jenkins
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ci.tomciusromcius.github.io
  resources:
  - jenkins/status
  verbs:
  - get
