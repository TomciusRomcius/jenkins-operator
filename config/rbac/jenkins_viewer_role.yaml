# This rule is not used by the project jenkins-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ci.tomciusromcius.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: jenkins-operator
    app.kubernetes.io/managed-by: kustomize
  name: jenkins-viewer-role
rules:
- apiGroups:
  - ci.tomciusromcius.github.io
  resources:
  - jenkins
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ci.tomciusromcius.github.io
  resources:
  - jenkins/status
  verbs:
  - get
